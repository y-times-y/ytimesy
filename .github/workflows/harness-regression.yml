name: Harness behavior regression
# Manual only while GitHub Actions billing is failing: pushes and PRs would
# otherwise fail with "job was not started". Restore pull_request and push
# triggers once billing is fixed.
on:
  workflow_dispatch:
jobs:
  behavior:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm harness:regression
      - run: pnpm exec tsx scripts/prove-claude-harness-linux.ts > .ytimesy/harness-linux-proof.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: harness-behavior-results
          path: |
            .ytimesy/harness-regression.xml
            .ytimesy/harness-linux-proof.json
